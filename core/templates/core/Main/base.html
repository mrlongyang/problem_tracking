{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APB Problem Tracking</title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'core/images/logoo.png' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'core/css/fonts.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    {% block full_page_content %}
        <div class="container mt-4">
            {% block content %}
            {% endblock %}
        </div>
    {% endblock %}

    {% block extra_js %}
    {% endblock %}
</body>
</html>
